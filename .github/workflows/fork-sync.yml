name: Fork Sync

# Merges upstream Licoy/Quosparr into this fork's main, tests and pushes it,
# then publishes a signed macOS release and adds Windows x64 assets to the
# same release (docs/fork.md). Pushes use GITHUB_TOKEN, which cannot change
# workflow files: an upstream change under .github/workflows fails the push
# and needs a manual sync.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Only add Windows x64 assets to the current version's existing release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'fan776783/Quosparr'
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.merge.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')"
          if [[ "$WINDOWS_ONLY" == true ]]; then
            printf 'version=%s\nchanged=false\nrelease=false\n' "$version" >> "$GITHUB_OUTPUT"
            echo "Only adding Windows x64 assets to existing v$version" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Licoy/Quosparr.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream"
          else
            git show HEAD:mygo.json > "$RUNNER_TEMP/fork-mygo.json"
            git show upstream/main:mygo.json > "$RUNNER_TEMP/upstream-mygo.json"
            if ! git merge --no-edit upstream/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ "$conflicts" != mygo.json ]]; then
                git merge --abort
                {
                  echo "### Upstream merge conflicts"
                  echo
                  printf -- '- `%s`\n' $conflicts
                  echo
                  echo "Merge upstream locally as described in docs/fork.md."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Upstream merge conflicts: $(echo $conflicts)"
                exit 1
              fi
              git checkout --theirs mygo.json
            fi
            version="$(python3 Scripts/fork-sync-config.py "$RUNNER_TEMP/fork-mygo.json" "$RUNNER_TEMP/upstream-mygo.json")"
            git add mygo.json
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit
            elif ! git diff --cached --quiet; then
              git commit -m "chore(fork): 同步上游版本号为 $version"
            fi
          fi
          changed=false
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || changed=true
          release=true
          ! gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || release=false
          {
            echo "version=$version"
            echo "changed=$changed"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, merged: $changed, release needed: $release" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v6
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - name: Verify Go and release helpers
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.release == 'true'
        run: bash Scripts/check-go-release.sh
      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: |
          if ! git push origin HEAD:main; then
            echo "Push failed. If upstream changed .github/workflows, GITHUB_TOKEN cannot push it: merge upstream locally (docs/fork.md)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publish signed release
        if: steps.merge.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_UPDATE_PRIVATE_KEY: ${{ secrets.FORK_UPDATE_PRIVATE_KEY }}
        run: |
          [[ -n "$FORK_UPDATE_PRIVATE_KEY" ]] || { echo "::error::Missing FORK_UPDATE_PRIVATE_KEY secret"; exit 1; }
          key="$RUNNER_TEMP/mygo-update.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$FORK_UPDATE_PRIVATE_KEY" > "$key")
          FORK_REMOTE=origin FORK_REPO="$GITHUB_REPOSITORY" FORK_UPDATE_KEY="$key" ARCH=arm64 \
            bash Scripts/fork-release.sh

  windows-release:
    needs: sync
    if: github.repository == 'fan776783/Quosparr'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FORK_VERSION: ${{ needs.sync.outputs.version }}
    steps:
      - name: Check Windows release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$FORK_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/fork-windows-release.json"
          python - <<'PY'
          import json, os, pathlib, re
          version = os.environ['FORK_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+-cursor\.[1-9]\d*', version):
              raise SystemExit('Invalid fork version')
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'fork-windows-release.json').read_text())
          if release['tagName'] != 'v' + version or release['isDraft'] or release['isPrerelease']:
              raise SystemExit('Expected a published fork release')
          required = {f'Quosparr.Setup.{version}.amd64.exe',
                      f'quosparr-{version}-windows-amd64.tar.gz', 'update-windows-amd64.json'}
          present = {a['name'] for a in release['assets'] if a['name'] in required}
          if present and present != required:
              raise SystemExit('Incomplete Windows assets; inspect the previous upload before retrying (no assets will be overwritten)')
          if any(a['size'] <= 0 for a in release['assets'] if a['name'] in required):
              raise SystemExit('Empty Windows release asset')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(not present).lower() + '\n')
          PY
      - uses: actions/checkout@v7
        if: steps.assets.outputs.needed == 'true'
        with:
          ref: refs/tags/v${{ needs.sync.outputs.version }}
      - uses: actions/setup-go@v6
        if: steps.assets.outputs.needed == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        if: steps.assets.outputs.needed == 'true'
        with:
          python-version: "3.13"
      - name: Package signed Windows x64
        if: steps.assets.outputs.needed == 'true'
        env:
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.FORK_UPDATE_PRIVATE_KEY }}
          V1_DEVELOPMENT_PACKAGE: "0"
        run: |
          [[ -n "$MYGO_UPDATE_PRIVATE_KEY" ]] || { echo "::error::Missing FORK_UPDATE_PRIVATE_KEY secret"; exit 1; }
          python - <<'PY'
          import json, os
          config = json.load(open('mygo.json'))
          assert config['version'] == os.environ['FORK_VERSION'], 'Release tag version mismatch'
          assert config['updates']['github'] == os.environ['GITHUB_REPOSITORY'], 'Wrong update repository'
          PY
          python3() { python "$@"; }
          export -f python3
          export V1_BUILD_DIR="$PWD/build/fork-windows"
          bash Scripts/package-v1-platform.sh windows/amd64
      - name: Verify native Windows installation
        if: steps.assets.outputs.needed == 'true'
        shell: pwsh
        run: ./Scripts/verify-v1-windows-native.ps1 -Stage "build/fork-windows/windows-amd64" -Arch amd64
      - name: Upload Windows release assets
        if: steps.assets.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$PWD/build/fork-windows/windows-amd64"
          go run ./Scripts/release-assets verify -config build/fork-windows/config/mygo.json -dir "$stage" -targets windows-amd64
          installer="Quosparr.Setup.$FORK_VERSION.amd64.exe"
          cp "$stage/Quosparr Setup $FORK_VERSION amd64.exe" "$stage/$installer"
          gh release upload "v$FORK_VERSION" --repo "$GITHUB_REPOSITORY" \
            "$stage/$installer" "$stage/quosparr-$FORK_VERSION-windows-amd64.tar.gz"
          # Expose the signed update manifest only after its payload is uploaded.
          gh release upload "v$FORK_VERSION" --repo "$GITHUB_REPOSITORY" "$stage/update-windows-amd64.json"
          echo "Windows x64 assets added to v$FORK_VERSION" >> "$GITHUB_STEP_SUMMARY"
